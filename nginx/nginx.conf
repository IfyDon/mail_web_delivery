user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Upstream: gunicorn ────────────────────────────────────────────────
    upstream django {
        server web:8000;
    }

    # ── HTTP: health probe, ACME challenge, then redirect everything → HTTPS ─
    server {
        listen 80;
        server_name _;

        # Docker/k8s liveness probe — must not redirect (no HTTPS yet during startup)
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Let's Encrypt ACME challenge (certbot writes files here during cert issuance)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else → permanent redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────
    # TO ENABLE:
    #   1. Replace YOUR_DOMAIN with your actual domain (two places below)
    #   2. Run: certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN
