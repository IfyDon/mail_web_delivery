{% extends "base.html" %}
{% block title %}Dashboard — WebMail{% endblock %}

{% block content %}
<div class="py-10">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Dashboard</h1>
      <form method="post" action="/logout/">
        {% csrf_token %}
        <button type="submit"
                class="text-sm font-medium text-gray-500 hover:text-indigo-600 transition-colors">
          Sign out
        </button>
      </form>
    </div>
    <div class="rounded-lg border border-gray-200 bg-white p-8 text-center">
      <p class="text-gray-500 text-sm">
        Welcome, <span class="font-semibold text-gray-900">{{ request.user.email }}</span>
      </p>
      <p class="mt-4 text-sm text-gray-400">
        Your dashboard is loading. Check <a href="/api/docs/" class="text-indigo-600 hover:underline">API docs</a>
        or visit the <a href="/admin/" class="text-indigo-600 hover:underline">admin panel</a>.
      </p>
    </div>
  </div>
</div>
{% endblock %}
