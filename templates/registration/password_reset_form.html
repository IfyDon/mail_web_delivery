{% extends "landing/base.html" %}
{% block title %}Reset your password — WebMail{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Reset your password</h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Enter the email address for your account and we'll send you a reset link.
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
      <form method="post" class="space-y-5">
        {% csrf_token %}

        <div>
          <label for="id_email" class="block text-sm font-medium text-gray-700">Email address</label>
          <div class="mt-1">
            <input type="email" name="email" id="id_email" required autofocus
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                   placeholder="you@example.com">
          </div>
        </div>

        <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
          Send reset link
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        Remembered it?
        <a href="/login/" class="font-medium text-indigo-600 hover:text-indigo-500">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
