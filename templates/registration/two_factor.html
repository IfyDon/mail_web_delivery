{% extends "landing/base.html" %}
{% block title %}Verify your identity — WebMail{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Two-factor verification</h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Enter the 6-digit code from your authenticator app (or a backup code).
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">

      {% if error %}
      <div class="mb-4 rounded-md bg-red-50 p-4">
        <p class="text-sm text-red-700">{{ error }}</p>
      </div>
      {% endif %}

      <form method="post" class="space-y-5">
        {% csrf_token %}
        <div>
          <label for="code" class="block text-sm font-medium text-gray-700">Authentication code</label>
          <div class="mt-1">
            <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
                   autofocus required placeholder="123456"
                   class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-center tracking-widest
                          shadow-sm placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
          </div>
        </div>
        <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
          Verify
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
