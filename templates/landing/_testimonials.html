{# ── Testimonials carousel ────────────────────────────────────────── #}
<section class="bg-gray-50 py-24" x-data="testimonials()">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

    <div class="text-center mb-14">
      <h2 class="text-3xl font-bold tracking-tight sm:text-4xl">Loved by developers</h2>
      <p class="mt-3 text-gray-500">Don't take our word for it.</p>
    </div>

    <div class="relative overflow-hidden">
      <div class="flex transition-transform duration-500 ease-in-out"
           :style="`transform: translateX(-${active * 100}%)`">

        {# Slide 0 #}
        <div class="w-full flex-shrink-0 px-4">
          <figure class="mx-auto max-w-2xl rounded-2xl bg-white p-10 shadow-md ring-1 ring-gray-100 text-center">
            <blockquote class="text-lg text-gray-700 leading-relaxed">
              "We migrated from SendGrid and our delivery rate jumped 4 points in the first week.
              The separated streams feature alone was worth the switch."
            </blockquote>
            <figcaption class="mt-6 flex flex-col items-center gap-1">
              <div class="h-10 w-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold text-sm">JK</div>
              <p class="font-semibold text-gray-900 mt-2">Jamie Kim</p>
              <p class="text-sm text-gray-500">Senior Engineer, Acme Corp</p>
            </figcaption>
          </figure>
        </div>

        {# Slide 1 #}
        <div class="w-full flex-shrink-0 px-4">
          <figure class="mx-auto max-w-2xl rounded-2xl bg-white p-10 shadow-md ring-1 ring-gray-100 text-center">
            <blockquote class="text-lg text-gray-700 leading-relaxed">
              "The API was up in 10 minutes, webhooks in 20. I've never integrated an
              email provider this fast. The docs are genuinely excellent."
            </blockquote>
            <figcaption class="mt-6 flex flex-col items-center gap-1">
              <div class="h-10 w-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 font-bold text-sm">SR</div>
              <p class="font-semibold text-gray-900 mt-2">Sofia Reyes</p>
              <p class="text-sm text-gray-500">CTO, NovaTech</p>
            </figcaption>
          </figure>
        </div>

        {# Slide 2 #}
        <div class="w-full flex-shrink-0 px-4">
          <figure class="mx-auto max-w-2xl rounded-2xl bg-white p-10 shadow-md ring-1 ring-gray-100 text-center">
            <blockquote class="text-lg text-gray-700 leading-relaxed">
              "Real-time open and click analytics surfaced an A/B winner we'd been guessing
              at for months. The ROI on WebMail paid for itself in two campaigns."
            </blockquote>
            <figcaption class="mt-6 flex flex-col items-center gap-1">
              <div class="h-10 w-10 rounded-full bg-violet-100 flex items-center justify-center text-violet-700 font-bold text-sm">ML</div>
              <p class="font-semibold text-gray-900 mt-2">Marcus Lee</p>
              <p class="text-sm text-gray-500">Head of Growth, DataFlow</p>
            </figcaption>
          </figure>
        </div>

      </div>
    </div>

    {# Dot navigation #}
    <div class="mt-8 flex justify-center gap-2">
      <template x-for="(_, i) in 3" :key="i">
        <button @click="active = i"
                :class="active === i ? 'bg-indigo-600 w-6' : 'bg-gray-300 w-2'"
                class="h-2 rounded-full transition-all duration-300"></button>
      </template>
    </div>

    {# Prev / Next arrows #}
    <div class="mt-4 flex justify-center gap-3">
      <button @click="prev()"
              class="rounded-full border border-gray-200 bg-white p-2 text-gray-500 hover:border-indigo-300 hover:text-indigo-600 transition-colors shadow-sm">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <button @click="next()"
              class="rounded-full border border-gray-200 bg-white p-2 text-gray-500 hover:border-indigo-300 hover:text-indigo-600 transition-colors shadow-sm">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

  </div>
</section>

<script>
function testimonials() {
  return {
    active: 0,
    total: 3,
    next() { this.active = (this.active + 1) % this.total; },
    prev() { this.active = (this.active - 1 + this.total) % this.total; },
  };
}
</script>
