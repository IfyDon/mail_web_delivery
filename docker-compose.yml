x-common-env: &common-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DATABASE_URL: postgresql://web_mail_user:${DB_PASSWORD}@db:5432/web_mail_db
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  REDIS_CACHE_URL: redis://redis:6379/2
  SECRET_KEY: ${SECRET_KEY}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  SIGNING_KEY: ${SIGNING_KEY}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
  BASE_URL: ${BASE_URL:-http://localhost:8000}
  TRACKING_BASE_URL: ${TRACKING_BASE_URL:-http://localhost:8000}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  PHYSICAL_ADDRESS: ${PHYSICAL_ADDRESS}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  GEOIP_PATH: ${GEOIP_PATH:-/app/geoip}
  MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: web_mail_db
      POSTGRES_USER: web_mail_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web_mail_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media

  worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    restart: unless-stopped
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower
    restart: unless-stopped
    command: >
      celery flower
      --broker=redis://redis:6379/0
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_files:/app/media:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  media_files:
