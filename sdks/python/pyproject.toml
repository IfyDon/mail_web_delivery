[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webmail-sdk"
version = "0.1.0"
description = "Official Python client for the WebMail transactional email API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "WebMail" }]
keywords = ["email", "transactional-email", "api", "webmail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[project.urls]
Homepage = "https://webmailapi.com"
Documentation = "https://webmailapi.com/api/docs/"
Repository = "https://github.com/IfyDon/mail_web_delivery"

[tool.hatch.build.targets.wheel]
packages = ["src/webmail_sdk"]
